<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - GolfCartPro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-tertiary">
  

  <!-- Floating Actions -->
  <div class="position-absolute top-0 end-0 p-3 z-3 d-flex gap-2">
    <button id="rtlToggle" class="btn btn-sm btn-outline-secondary rounded-circle" aria-label="Toggle RTL">RTL</button>
    <button class="btn btn-sm btn-outline-secondary rounded-circle" id="themeToggle" aria-label="Toggle Theme">
      <i class="bi bi-moon-fill" id="themeIcon"></i>
    </button>
  </div>

  <!-- Main Content -->
  <main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
          <div class="card p-4 p-md-5">
            <div class="text-center mb-4">
              <a href="index.html" class="text-decoration-none d-inline-flex align-items-center fw-bold text-primary display-6 mb-2">
                <i class="bi bi-ev-front-fill me-2"></i> GolfCartPro
              </a>
              <h3 class="fw-bold mt-2">Welcome Back</h3>
            </div>
            
            <form action="index.html">
              <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group mb-1">
                  <input type="password" class="form-control" id="password" required>
                  <button class="btn btn-outline-secondary toggle-password" type="button" tabindex="-1">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
                <div class="text-end">
                  <a href="#" class="text-decoration-none small text-primary">Forgot Password?</a>
                </div>
              </div>
              <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe">
                <label class="form-check-label text-secondary" for="rememberMe">Remember me</label>
              </div>
              <button type="submit" class="btn btn-primary w-100 mb-4">Login</button>
              
              <div class="position-relative mb-4 text-center">
                <hr class="text-secondary">
                <span class="position-absolute top-50 start-50 translate-middle bg-body px-2 text-secondary small">OR LOGIN WITH</span>
              </div>
              
              <div class="d-flex gap-3 justify-content-center mb-4">
                <a href="#" class="btn btn-outline-secondary rounded-circle social-btn" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
                <a href="#" class="btn btn-outline-secondary rounded-circle social-btn" aria-label="X"><i class="bi bi-twitter-x"></i></a>
                <a href="#" class="btn btn-outline-secondary rounded-circle social-btn" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
                <a href="#" class="btn btn-outline-secondary rounded-circle social-btn" aria-label="LinkedIn"><i class="bi bi-linkedin"></i></a>
              </div>
              
              <div class="text-center text-secondary">
                Don't have an account? <a href="register.html" class="text-decoration-none text-primary fw-bold">Sign up</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>



  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
