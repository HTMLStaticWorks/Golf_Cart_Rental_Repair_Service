<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - GolfCartPro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-tertiary d-flex flex-column min-vh-100">
  

  <!-- Header Actions -->
  <div class="d-flex justify-content-end p-3 p-md-4">
    <div class="d-flex gap-2">
      <button id="rtlToggle" class="btn btn-sm btn-outline-secondary rounded-circle" aria-label="Toggle RTL">RTL</button>
      <button class="btn btn-sm btn-outline-secondary rounded-circle" id="themeToggle" aria-label="Toggle Theme">
        <i class="bi bi-moon-fill" id="themeIcon"></i>
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
          <div class="card p-4 p-md-5">
            <div class="text-center mb-4">
              <a href="index.html" class="text-decoration-none d-inline-flex align-items-center fw-bold text-primary display-6 mb-2">
                <i class="bi bi-ev-front-fill me-2"></i> GolfCartPro
              </a>
              <h3 class="fw-bold mt-2">Create Account</h3>
            </div>
            
            <form action="index.html">
              <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="name" placeholder="John Doe" required>
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                  <input type="password" class="form-control" id="password" required>
                  <button class="btn btn-outline-secondary toggle-password" type="button" tabindex="-1">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>
              <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <div class="input-group">
                  <input type="password" class="form-control" id="confirmPassword" required>
                  <button class="btn btn-outline-secondary toggle-password" type="button" tabindex="-1">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>
              <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input" id="terms" required>
                <label class="form-check-label text-secondary small" for="terms">I agree to the <a href="#" class="text-decoration-none">Terms and Conditions</a></label>
              </div>
              <button type="submit" class="btn btn-primary w-100 mb-4">Sign Up</button>
              
              <div class="position-relative mb-4 text-center">
                <hr class="text-secondary">
                <span class="position-absolute top-50 start-50 translate-middle bg-body px-2 text-secondary small">OR SIGN UP WITH</span>
              </div>
              
              <div class="d-flex gap-3 justify-content-center mb-4">
                <a href="#" class="btn btn-outline-secondary rounded-circle social-btn" aria-label="Google"><i class="bi bi-google"></i></a>
                <a href="#" class="btn btn-outline-secondary rounded-circle social-btn" aria-label="Apple"><i class="bi bi-apple"></i></a>
              </div>
              
              <div class="text-center text-secondary">
                Already have an account? <a href="login.html" class="text-decoration-none text-primary fw-bold">Login</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>



  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
